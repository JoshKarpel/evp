[tools]
just = "1.59.0"
rust = { version = "1.99.1", components = "clippy,rustfmt" }
uv = "0.13.1"
# libghostty-vt-sys builds Ghostty with whatever `zig` is on PATH, and Ghostty refuses any Zig
# but the one its build.zig.zon names, so this follows the Ghostty commit pinned by the
# libghostty-vt version in Cargo.lock: bumping that can mean bumping this.
zig = "0.15.2"

[settings]
# Skip brand-new releases when resolving any fuzzy version, as supply-chain defense.
minimum_release_age = "7d"
