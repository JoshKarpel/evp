[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "evp"
version = "0.0.1"
description = "A Python binding to libghostty-vt, Ghostty's terminal emulator library"
requires-python = ">=3.13"
license = "MIT"
readme = "README.md"
authors = [{ name = "Josh Karpel", email = "josh.karpel@gmail.com" }]
keywords = ["terminal", "emulator", "ghostty", "vt"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/JoshKarpel/evp"
Issues = "https://github.com/JoshKarpel/evp/issues"

[tool.uv]
exclude-newer = "7 days"

[tool.maturin]
features = ["pyo3/extension-module", "abi3"]
python-source = "python"
module-name = "evp._evp"

[tool.ruff]
line-length = 100
fix = true
src = ["python", "tests", "spike"]

[tool.ruff.lint]
select = ["A", "ANN", "B", "C4", "E", "F", "I", "PERF", "PIE", "PL", "PT", "PTH", "RET", "RUF", "SIM", "UP", "W"]
ignore = [
    "A002",  # builtin shadowing
    "PLR2004",  # magic constants
]

[tool.ruff.lint.per-file-ignores]
# The spike's prototype reuses counterweight's code and signatures, which run 120 columns wide.
"spike/*" = ["E501", "PLR0913", "PLR0917"]

[tool.mypy]
strict = true
files = ["python", "tests"]

[tool.pytest]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "maturin>=1.12.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.27.0",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.15.1",
]
