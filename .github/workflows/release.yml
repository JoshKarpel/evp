name: Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build
    uses: $/.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: pypi
      url: https://pypi.org/p/evp

    permissions:
      id-token: write  # Trusted publishing: PyPI trusts this workflow and environment, so no API token exists.

    steps:
      - name: Download wheels and sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
